<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1c2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>ΠΕΓΠ Culture</title>
<style>
:root{
  --bg:#0e1c2f; --panel:#16283f; --panel2:#1b3049; --line:#2b425e;
  --cream:#f2ead2; --creamline:#ddd2b4; --ink:#22303f;
  --accent:#3fb2a8; --accentdk:#2b8d85;
  --known:#7fb27f; --almost:#3fb2a8; --imp:#e07a58; --live:#9db4cc;
  --dim:#93a7bd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#e8eef5;
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 26px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:23px;margin:0;font-weight:700;color:#f4f7fa}
h1 em{font-style:italic;color:var(--accent)}
.pos{font-size:14px;color:var(--dim);white-space:nowrap}
.piles{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.pile{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 12px 10px;
  text-align:left;cursor:pointer;color:inherit;font-family:inherit}
.pile.on{border-color:var(--accent)}
.pile .n{font-family:Georgia,serif;font-size:26px;font-weight:700;line-height:1;color:var(--live)}
.pile.k .n{color:var(--known)} .pile.a .n{color:var(--almost)} .pile.i .n{color:var(--imp)}
.pile{padding:11px 9px 9px}
.pile .lb{font-size:10.5px;letter-spacing:1px}
.pile .lb{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:7px}
.card{background:var(--cream);color:var(--ink);border-radius:12px;padding:20px 20px 24px;min-height:300px}
.qnum{color:#8b8161;font-weight:600;margin-bottom:10px}
.q{font-size:21px;font-weight:700;line-height:1.4;white-space:pre-wrap;margin-bottom:14px}
.qimg{width:100%;max-width:360px;border-radius:6px;display:block;margin:0 auto 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;
  border:none;border-bottom:1px solid var(--creamline);padding:11px 2px;font-family:inherit;
  font-size:16px;line-height:1.4;color:var(--ink);cursor:pointer}
.opt .l{font-weight:700;color:var(--accentdk);min-width:20px}
.opt.correct{background:#dcefe6} .opt.correct .l{color:#2c7a4b}
.opt.wrong{background:#f6dcd4} .opt.wrong .l{color:#b34a30}
.opt.dim{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.grid2 .opt{flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--creamline);
  border-radius:8px;padding:8px}
.grid2 img{width:100%;border-radius:5px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{border:1px solid var(--creamline);padding:8px 9px;vertical-align:top}
tr:first-child td{font-weight:700;font-size:13px;background:#e8dfc4}
.lines{font-size:16.5px;line-height:1.7;margin:0;padding:0;list-style:none}
.lines li{border-bottom:1px solid var(--creamline);padding:6px 0}
.ansbox{margin-top:18px;border-top:2px solid var(--accentdk);padding-top:12px}
.ansbox .lb{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:#8b8161;font-weight:600}
.ansbox .val{font-size:21px;font-weight:700;margin-top:6px;line-height:1.45;color:var(--accentdk)}
.verdict{margin-top:16px;font-size:16px;font-weight:700}
.verdict.ok{color:#2c7a4b} .verdict.bad{color:#b34a30}
.show{width:100%;margin-top:12px;background:var(--accent);color:#0e1c2f;font-weight:700;font-size:17px;
  border:none;border-radius:10px;padding:16px;font-family:inherit;cursor:pointer}
.sort{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sort button{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 4px;
  font-family:inherit;cursor:pointer;color:var(--dim);line-height:1.3}
.sort button b{display:block;font-size:15px}
.sort button small{font-size:11.5px}
.sort .b1 b{color:var(--live)} .sort .b2 b{color:var(--known)} .sort .b3 b{color:var(--almost)} .sort .b4 b{color:var(--imp)}
.sort button.cur{border-color:currentColor;background:var(--panel2)}
.sort .b1.cur{border-color:var(--live)} .sort .b2.cur{border-color:var(--known)} .sort .b3.cur{border-color:var(--almost)} .sort .b4.cur{border-color:var(--imp)}
#backup{margin-top:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:14px}
#backup textarea{width:100%;height:110px;background:#0b1626;color:#cfe0ee;border:1px solid var(--line);
  border-radius:8px;padding:9px;font-family:monospace;font-size:12px;resize:vertical}
#backup .row{display:flex;gap:8px;margin-top:9px}
#backup .row button{flex:1;background:var(--accent);color:#0e1c2f;border:none;border-radius:9px;
  padding:11px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
#backup .row button.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
#backup p{font-size:12px;color:var(--dim);margin:0 0 9px;line-height:1.5}
#msg{font-size:12.5px;color:var(--accent);margin-top:8px;min-height:16px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{background:var(--panel);border:1.5px solid var(--line);color:#dce6f0;border-radius:9px;
  padding:11px 18px;font-family:inherit;font-size:14.5px;cursor:pointer}
.nav button:disabled{opacity:.4}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--dim)}
footer button{background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;
  text-decoration:underline;cursor:pointer;padding:0}
.empty{color:var(--dim);text-align:center;padding:60px 10px;font-size:16px;line-height:1.6}
@media(max-width:420px){h1{font-size:20px}.q{font-size:19.5px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Greek Culture <em>P.E.G.P.</em></h1><span class="pos" id="pos"></span></header>
  <div class="piles" id="piles"></div>
  <div id="main"></div>
  <footer><span>70 questions · November 2026</span>
    <span><button onclick="toggleBackup()">Backup / restore</button> &nbsp;·&nbsp; <button onclick="reset()">Reset piles</button></span></footer>
  <div id="backup" style="display:none">
    <p>Your progress as text. <b>Copy</b> it to keep a snapshot you can return to. To go back to an earlier snapshot, paste it in below and tap <b>Restore</b>.</p>
    <textarea id="bk" spellcheck="false"></textarea>
    <div class="row"><button onclick="copyBk()">Copy backup</button><button class="alt" onclick="restoreBk()">Restore</button></div>
    <div id="msg"></div>
  </div>
</div>

}
function step(d){ idx = Math.min(Math.max(idx + d, 0), order.length - 1);
  revealed = false; picked = null; render(); }
function pick(l){ const q = cur(); picked = l; piles[q.n] = (l === q.ans) ? "known" : "imp"; save(); render(); }
function move(n, p){ piles[n] = p; save(); render(); }
function reveal(){ revealed = true; render(); }
function reset(){ if(confirm("Reset all progress? Every card goes back to Live.")){
  QUESTIONS.forEach(q => piles[q.n] = "live"); save(); openPile("live", false); } }
function toggleBackup(){ const el = document.getElementById("backup");
  const open = el.style.display !== "none";
  el.style.display = open ? "none" : "block";
  if(!open){ document.getElementById("bk").value = JSON.stringify(piles); document.getElementById("msg").textContent = ""; } }
function copyBk(){ const t = document.getElementById("bk"); t.select(); t.setSelectionRange(0,999999);
  try{ document.execCommand("copy"); msg("Copied — paste it somewhere safe."); }catch(e){ msg("Select the text and copy it manually."); } }
function restoreBk(){
  try{
    const o = JSON.parse(document.getElementById("bk").value);
    let n = 0; const fresh = {};
    QUESTIONS.forEach(q => { const v = o[q.n];
      fresh[q.n] = ORDER.indexOf(v) >= 0 ? v : "live"; if(ORDER.indexOf(v) >= 0) n++; });
    if(!confirm("Restore this backup? It replaces your current piles.")) return;
    piles = fresh; save(); openPile("live", false);
    document.getElementById("backup").style.display = "block"; msg("Restored " + n + " cards.");
  }catch(e){ msg("That doesn't look like a valid backup."); }
}
function msg(t){ document.getElementById("msg").textContent = t; }
const cur = () => QUESTIONS.find(x => x.n === order[idx]);

function renderPiles(){
  document.getElementById("piles").innerHTML = ORDER.map(p =>
    `<button class="pile ${p==='known'?'k':p==='almost'?'a':p==='imp'?'i':''} ${pile===p?'on':''}" onclick="openPile('${p}',false)">
      <div class="n">${inPile(p).length}</div><div class="lb">${NAME[p]}</div></button>`).join("");
}

function optBtn(q, lab, inner, imgMode){
  let cls = "opt";
  if(picked !== null) cls += lab===q.ans ? " correct" : (lab===picked ? " wrong" : " dim");
  return `<button class="${cls}" ${picked===null?`onclick="pick('${lab}')"`:""}>${inner}</button>`;
}

function render(){
  renderPiles();
  const posEl = document.getElementById("pos"), main = document.getElementById("main");
  if(!order.length){
    posEl.textContent = "0 / 0";
    main.innerHTML = `<div class="empty">The <b>${NAME[pile]}</b> pile is empty.<br>Sort some cards into it first.</div>`;
    return;
  }
  const q = cur(), L = ["Α","Β","Γ","Δ"];
  posEl.textContent = (idx+1) + " / " + order.length;
  let b = `<div class="qnum">ΘΕΜΑ ${q.n} · ${q.sec==='A'?'Αρχαιότητες':'Σύγχρονος'}</div>`;
  if(q.img) b += `<img class="qimg" src="${q.img}" alt="">`;
  b += `<div class="q">${esc(q.q)}</div>`;

  if(q.type === "mcq"){
    if(q.optimgs){
      b += `<div class="grid2">` + q.optimgs.map(([lab,src]) =>
        optBtn(q, lab, `<img src="${src}" alt=""><span class="l">Εικ. ${lab}</span>`)).join("") + `</div>`;
    } else {
      b += q.opts.map((t,i) =>
        optBtn(q, L[i], `<span class="l">${L[i]}.</span><span>${esc(t)}</span>`)).join("");
    }
    if(picked !== null){
      const ok = picked === q.ans;
      b += `<div class="verdict ${ok?'ok':'bad'}">${ok ? "✓ Σωστά — moved to Known" : "✗ Λάθος — moved to Important"}</div>`;
      b += `<div class="ansbox"><div class="lb">Απάντηση</div><div class="val">${esc(q.ans)}</div></div>`;
    }
  } else {
    if(q.table) b += `<table>` + q.table.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("") + `</table>`;
    if(q.lines) b += `<ul class="lines">` + q.lines.map(l => `<li>${esc(l)}</li>`).join("") + `</ul>`;
    if(q.optimgs) b += `<div class="grid2">` + q.optimgs.map(([lab,src]) =>
      `<div class="opt" style="cursor:default"><img src="${src}" alt=""><span class="l">Εικ. ${lab}</span></div>`).join("") + `</div>`;
    if(revealed) b += `<div class="ansbox"><div class="lb">Απάντηση</div><div class="val">${esc(q.ans)}</div></div>`;
  }

  const showBtn = (q.type !== "mcq" && !revealed) ? `<button class="show" onclick="reveal()">Show answer</button>` : "";
  const p = piles[q.n];
  const answered = (q.type === "mcq") ? (picked !== null) : revealed;
  const sort = !answered ? "" : `<div class="sort">` + ORDER.map((x,i) =>
    `<button class="b${i+1} ${p===x?'cur':''}" onclick="move(${q.n},'${x}')">
       <b>${NAME[x]}</b><small>${SUB[x]}</small></button>`).join("") + `</div>`;

  main.innerHTML = `<div class="card">${b}</div>${showBtn}${sort}
    <div class="nav">
      <button onclick="step(-1)" ${idx===0?'disabled':''}>← Back</button>
      <button onclick="openPile(pile,true)">Shuffle</button>
      <button onclick="step(1)" ${idx===order.length-1?'disabled':''}>Next →</button>
    </div>`;
  window.scrollTo(0,0);
}
load(); openPile("live", false);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
